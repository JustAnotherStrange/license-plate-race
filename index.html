<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c3a">
<meta name="color-scheme" content="light">
<title>License Plate Race</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { color-scheme:light; --paper:#f6edd6; --card:#fffaea; --ink:#2a2733; --muted:#7a6f5c; --line:#dccfae; --both:#7c3aed;
    --green:#0f5c3a; --green2:#0b4a2e; --yellow:#ffc933; --land:#ecdfbb; --sea:#cfe5e8;
    --display:"Bungee","Arial Black",system-ui,sans-serif; --body:"Fredoka",system-ui,-apple-system,sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; color:var(--ink); font:16px/1.3 var(--body); padding-bottom:40px; background-color:var(--paper);
    background-image:linear-gradient(rgba(120,95,40,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(120,95,40,.07) 1px,transparent 1px);
    background-size:28px 28px; }
  .top { background:var(--green); padding:max(8px,env(safe-area-inset-top)) 12px 0; }
  .brand { font:15px/1 var(--display); color:#fff; letter-spacing:.04em; text-align:center; padding:2px 0 8px; display:flex; align-items:center; justify-content:center; gap:8px; }
  .brand::before, .brand::after { content:""; flex:1; height:0; border-top:3px dashed var(--yellow); opacity:.9; }
  header { position:sticky; top:0; z-index:5; background:var(--green); padding:2px 12px 0; border-bottom:4px solid var(--yellow); box-shadow:0 3px 0 var(--green2); }
  .score { display:flex; gap:8px; }
  .team { flex:1; min-width:0; color:var(--c); background:var(--card); border:3px solid var(--c); border-radius:12px; padding:5px 9px 8px; }
  .team.me { cursor:pointer; box-shadow:0 0 0 2px var(--green), 0 0 0 5px var(--yellow); }
  .team .n { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .team.me .n::after { content:" ✎"; opacity:.6; }
  .team .v { font:34px/1.05 var(--display); display:flex; align-items:baseline; gap:4px; }
  .team .v small { font:500 14px var(--body); opacity:.65; }
  .bar { height:8px; border-radius:99px; background:rgba(42,39,51,.12); overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:99px; background:var(--c); }
  .team .bar { margin-top:5px; }
  .total { margin:8px 0 0; background:var(--yellow); color:#2a2200; border:2px solid #2a2200; border-radius:99px; padding:3px 12px; font-size:13px; font-weight:500; text-align:center; }
  .total b { font:15px var(--display); }
  #statsbtn { display:flex; align-items:center; justify-content:center; gap:8px; width:calc(100% - 24px); margin:12px 12px 0; min-height:44px; background:var(--card); border:2px solid var(--ink); border-radius:12px; box-shadow:0 3px 0 var(--ink); font:600 15px var(--body); color:var(--ink); }
  #statsbtn:active { transform:translateY(3px); box-shadow:none; }
  #statsbtn .chev { font-size:13px; transition:transform .25s; }
  #statswrap.open #statsbtn .chev { transform:rotate(180deg); }
  .sbody { display:grid; grid-template-rows:0fr; transition:grid-template-rows .25s ease; }
  #statswrap.open .sbody { grid-template-rows:1fr; }
  #stats { min-height:0; overflow:hidden; visibility:hidden; transition:visibility .25s; }
  #statswrap.open #stats { visibility:visible; }
  .sgrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:12px 12px 0; }
  @media (prefers-reduced-motion:reduce) { .sbody, #statsbtn .chev, #stats { transition:none; } }
  .scol { background:var(--card); border:2px solid var(--ink); border-top:6px solid var(--c); border-radius:10px; padding:8px 10px 10px; min-width:0; }
  .scol h4 { margin:0 0 6px; font:13px var(--display); color:var(--c); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .srow { font-size:13px; font-weight:500; margin-top:6px; }
  .srow > div:first-child { display:flex; justify-content:space-between; }
  .srow .bar { height:6px; margin-top:3px; }
  .ppl { display:flex; flex-wrap:wrap; gap:4px; margin-top:9px; }
  .ppl span { font-size:12px; font-weight:500; background:var(--paper); border-radius:99px; padding:2px 8px; }
  .ppl b { color:var(--c); }
  .sboth { grid-column:1/-1; text-align:center; font-size:13px; font-weight:500; color:var(--muted); }
  .tabs { display:flex; gap:6px; margin-top:10px; }
  .tabs button { flex:1; background:var(--green2); border:0; border-radius:12px 12px 0 0; padding:9px; font:600 16px var(--body); color:#bfe3cf; }
  .tabs button.on { background:var(--paper); color:var(--green); box-shadow:0 4px 0 var(--paper); position:relative; top:4px; padding-bottom:13px; }
  #status { font-size:12px; color:var(--muted); padding:10px 14px 2px; display:flex; justify-content:space-between; }
  #status button { background:none; border:0; color:var(--muted); text-decoration:underline; font:inherit; padding:0; }
  h2 { margin:20px 12px 10px; font:16px/1 var(--display); letter-spacing:.05em; color:var(--green); display:flex; align-items:center; gap:10px; }
  h2::after { content:""; flex:1; border-top:3px dashed #d9a400; opacity:.7; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:10px; padding:0 12px; }
  .tile { position:relative; background:var(--card); border:2px solid var(--ink); border-radius:10px; min-height:88px; padding:8px; cursor:pointer; user-select:none; display:flex; flex-direction:column; justify-content:flex-end;
    box-shadow:0 3px 0 var(--ink); transition:transform .08s, box-shadow .08s; }
  .tile::before { content:""; position:absolute; inset:3px; border:1px solid rgba(42,39,51,.25); border-radius:7px; pointer-events:none; }
  .tile::after { content:""; position:absolute; bottom:6px; right:7px; width:6px; height:6px; border-radius:50%; background:rgba(42,39,51,.22); }
  .tile:active { transform:translateY(3px); box-shadow:0 0 0 var(--ink); }
  .tile .code { font:24px/1 var(--display); letter-spacing:.03em; }
  .tile .nm { font-size:11px; font-weight:500; color:var(--muted); margin-top:3px; }
  .tile.me-on { background:color-mix(in srgb, var(--mine) 14%, var(--card)); border-color:var(--mine); box-shadow:0 3px 0 var(--mine); }
  .tile.me-on .code { color:var(--mine); }
  .tile.me-on:active { box-shadow:0 0 0 var(--mine); }
  .dots { position:absolute; top:8px; left:8px; display:flex; gap:4px; }
  .dot { width:14px; height:14px; border-radius:50%; border:2px solid var(--line); background:transparent; }
  .dot.on { background:var(--c); border-color:var(--c); }
  .by { position:absolute; top:6px; right:9px; font-size:11px; font-weight:500; color:var(--muted); }
  #mapview { display:none; padding:12px; }
  .mapwrap { position:relative; border:3px solid var(--ink); border-radius:14px; background:var(--sea); box-shadow:0 4px 0 var(--ink); overflow:hidden; }
  .mapwrap::before { content:""; position:absolute; inset:5px; border:1.5px dashed rgba(42,39,51,.35); border-radius:9px; pointer-events:none; z-index:1; }
  .mapwrap .usmap { width:100%; height:auto; display:block; }
  .compass { position:absolute; right:10px; bottom:8px; width:44px; height:44px; opacity:.8; pointer-events:none; }
  #mapview .usmap path { stroke:#fffaea; stroke-width:1; stroke-linejoin:round; cursor:pointer; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:14px; font-size:13px; font-weight:500; }
  .legend i { display:inline-block; width:13px; height:13px; border-radius:4px; border:1.5px solid var(--ink); margin-right:5px; vertical-align:-2px; }
  #sheetbg { position:fixed; inset:0; background:rgba(15,40,28,.55); display:none; z-index:20; align-items:flex-end; justify-content:center; }
  #sheet { background:var(--card); width:min(520px,100vw); border-radius:20px 20px 0 0; border-top:5px solid var(--yellow); padding:16px 16px calc(18px + env(safe-area-inset-bottom)); max-height:85vh; overflow:auto; }
  #sheet h3 { margin:0 0 12px; font:20px/1.15 var(--display); color:var(--green); }
  #sheet .row { padding:8px 10px; border-left:5px solid var(--c); background:var(--paper); border-radius:8px; margin-bottom:6px; font-size:14px; }
  #sheet .row .s { color:var(--muted); font-size:12px; }
  #sheet .row a { color:inherit; }
  #sheet .lbl { font-size:13px; font-weight:600; color:var(--muted); margin:14px 0 6px; text-transform:uppercase; letter-spacing:.05em; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chips button { padding:11px 18px; font:600 16px var(--body); border-radius:999px; border:2px solid var(--c); background:#fff; color:var(--c); box-shadow:0 3px 0 var(--c); }
  .chips button:active { transform:translateY(3px); box-shadow:none; }
  .chips button.on { background:var(--c); color:#fff; }
  .chips button.danger { --c:#b91c1c; }
  .chips button.cancel { --c:#7a6f5c; }
  #who { position:fixed; inset:0; background:rgba(15,40,28,.8); display:none; align-items:center; justify-content:center; z-index:40; }
  #who .box { background:var(--card); padding:22px; border-radius:18px; border:4px solid var(--yellow); width:min(340px,90vw); text-align:center; }
  #who .box > div:first-child { font:20px/1.2 var(--display); color:var(--green); }
  #who button { display:block; width:100%; margin-top:12px; padding:14px; font:600 18px var(--body); border:0; border-radius:12px; color:#fff; box-shadow:0 4px 0 rgba(0,0,0,.3); }
  #nuke { font-family:var(--body); }
</style>
</head>
<body>
<div class="top"><div class="brand">License Plate Race</div></div>
<header>
  <div class="score" id="score"></div>
  <div class="total" id="total"></div>
  <div class="tabs"><button data-tab="plates" class="on">🪪 Plates</button><button data-tab="map">🗺️ Map</button></div>
</header>
<div id="statswrap"><button id="statsbtn" aria-expanded="false" aria-controls="stats">📊 Full stats <span class="chev">▾</span></button><div class="sbody"><div id="stats"></div></div></div>
<div id="status"><span id="net"></span><button id="switch">switch car</button></div>
<div id="boards"></div>
<div style="text-align:center;margin:30px 12px 0"><button id="nuke" style="background:none;border:1px solid #b91c1c;color:#b91c1c;border-radius:8px;padding:8px 12px;font:inherit;font-size:13px">Dangerous: clear everything</button></div>
<div id="mapview"></div>

<div id="sheetbg"><div id="sheet"></div></div>
<div id="who"><div class="box"><div style="font-size:18px;font-weight:600">Which car are you in?</div><div id="whoBtns"></div></div></div>
<!-- Photo feature disabled (impractical at speed). To restore, see git history.
<input type="file" accept="image/*" capture="environment" id="file" hidden>
-->

<script src="config.js?v=3"></script>
<script src="map.js?v=3"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const CFG = window.GAME_CONFIG;
const REGIONS = {
  "US States": { AL:"Alabama",AK:"Alaska",AZ:"Arizona",AR:"Arkansas",CA:"California",CO:"Colorado",CT:"Connecticut",DE:"Delaware",FL:"Florida",GA:"Georgia",HI:"Hawaii",ID:"Idaho",IL:"Illinois",IN:"Indiana",IA:"Iowa",KS:"Kansas",KY:"Kentucky",LA:"Louisiana",ME:"Maine",MD:"Maryland",MA:"Massachusetts",MI:"Michigan",MN:"Minnesota",MS:"Mississippi",MO:"Missouri",MT:"Montana",NE:"Nebraska",NV:"Nevada",NH:"New Hampshire",NJ:"New Jersey",NM:"New Mexico",NY:"New York",NC:"North Carolina",ND:"North Dakota",OH:"Ohio",OK:"Oklahoma",OR:"Oregon",PA:"Pennsylvania",RI:"Rhode Island",SC:"South Carolina",SD:"South Dakota",TN:"Tennessee",TX:"Texas",UT:"Utah",VT:"Vermont",VA:"Virginia",WA:"Washington",WV:"West Virginia",WI:"Wisconsin",WY:"Wyoming" },
  "Other US": { DC:"Washington D.C." },
  "Canada": { AB:"Alberta",BC:"British Columbia",MB:"Manitoba",NB:"New Brunswick",NL:"Newfoundland & Labrador",NS:"Nova Scotia",ON:"Ontario",PE:"Prince Edward Island",QC:"Quebec",SK:"Saskatchewan",NT:"Northwest Territories",NU:"Nunavut",YT:"Yukon" },
};
const ALL = Object.values(REGIONS).flatMap(r => Object.keys(r));
const US = Object.keys(REGIONS["US States"]), CA = Object.keys(REGIONS["Canada"]);
const NAME = Object.assign({}, ...Object.values(REGIONS));
const TEAMS = CFG.teams, IDS = Object.keys(TEAMS), PEOPLE = CFG.people || { a: ["Bennett", "Owen", "Joelie"], b: ["Lily", "Jax", "Becca"] };
const esc = t => String(t).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const $ = s => document.querySelector(s);
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

let me = load("plate.me", null);
if (me && !TEAMS[me]) me = null;
// state[teamId][code] = {t: spotted ms, m: last-modified ms, by, lat, lon, d?: 1 (removed)}
let state = load("plate.state", {}); IDS.forEach(i => state[i] ||= {});
let names = load("plate.names", {}); // names[id] = {n, t}
const tname = id => names[id]?.n || TEAMS[id].name;
let resetAt = load("plate.resetAt", 0), resetChecked = false;
let db = null, online = false, lastSync = load("plate.lastSync", null), tab = "plates";
const mod = e => e.m || e.t;

// ---- Firebase (optional) ----
if (CFG.firebase.databaseURL && window.firebase) {
  firebase.initializeApp(CFG.firebase);
  db = firebase.database();
  db.ref(".info/connected").on("value", s => { online = !!s.val(); if (online) pushAll(); renderStatus(); });
  // A reset wipes the room and stamps resetAt; every phone then wipes its local copy before it can re-push.
  db.ref(`${CFG.room}/resetAt`).on("value", snap => {
    const r = snap.val() || 0;
    if (r > resetAt) { resetAt = r; save("plate.resetAt", r); wipeLocal(); render(); }
    resetChecked = true; pushAll();
  });
  db.ref(`${CFG.room}/names`).on("value", snap => {
    const r = snap.val() || {};
    for (const [id, v] of Object.entries(r)) if (TEAMS[id] && (!names[id] || v.t > names[id].t)) names[id] = v;
    save("plate.names", names); render();
    for (const [id, v] of Object.entries(names)) if (!r[id] || v.t > r[id].t) db.ref(`${CFG.room}/names/${id}`).set(v).catch(() => {});
  });
  IDS.forEach(id => db.ref(`${CFG.room}/${id}`).on("value", snap => {
    const remote = snap.val() || {};
    for (const [code, r] of Object.entries(remote)) {
      const l = state[id][code];
      if (!l || mod(r) > mod(l)) state[id][code] = r;
    }
    lastSync = Date.now(); save("plate.lastSync", lastSync);
    persist(); render();
    if (id === me) pushAll();
  }));
}
function pushAll() {
  if (!db || !me || !resetChecked) return;
  for (const [code, e] of Object.entries(state[me])) db.ref(`${CFG.room}/${me}/${code}`).set(e).catch(() => {});
}
function persist() { save("plate.state", state); }
function commit(code) {
  persist(); render();
  if (db) db.ref(`${CFG.room}/${me}/${code}`).set(state[me][code]).catch(() => {});
}

// ---- actions ----
function markFound(code, by) {
  const now = Date.now();
  state[me][code] = { t: now, m: now, by };
  commit(code); locate(code, now);
}
// GPS fix arrives after the plate is already saved, so a slow/denied fix never blocks it.
function locate(code, t) {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => {
    const e = state[me][code];
    if (!e || e.d || e.t !== t) return;
    state[me][code] = { ...e, lat: +p.coords.latitude.toFixed(5), lon: +p.coords.longitude.toFixed(5), m: Date.now() };
    commit(code); if ($("#sheetbg").style.display === "flex") openSheet(code);
  }, () => {}, { enableHighAccuracy: true, timeout: 20000, maximumAge: 30000 });
}
function setBy(code, by) { state[me][code] = { ...state[me][code], by, m: Date.now() }; commit(code); }
function remove(code) { const now = Date.now(); state[me][code] = { t: now, m: now, d: 1 }; commit(code); }

function wipeLocal() {
  IDS.forEach(i => state[i] = {}); names = {};
  persist(); save("plate.names", names);
}
$("#nuke").onclick = async () => {
  if (prompt("This deletes ALL plates and car names for both cars. Type the password:") !== "cleareverything") return;
  resetAt = Date.now(); save("plate.resetAt", resetAt);
  wipeLocal();
  if (db) {
    try { await db.ref(CFG.room).set({ resetAt }); }
    catch { alert("Couldn't reach the server. Cleared on this phone only; try again with service."); }
  }
  closeSheet(); render();
};

const found = (id, code) => { const e = state[id][code]; return e && !e.d ? e : null; };
const count = (id, list = ALL) => list.filter(c => found(id, c)).length;
const countAny = list => list.filter(c => IDS.some(id => found(id, c))).length;

// ---- render ----
function render() {
  if (!me) return;
  const bar = (n, t, c) => `<div class="bar" ${c ? `style="--c:${c}"` : ""}><i style="width:${(100 * n / t).toFixed(1)}%"></i></div>`;
  $("#score").innerHTML = IDS.map(id => `<div class="team ${id===me?"me":""}" data-team="${id}" style="--c:${TEAMS[id].color}">
      <div class="n">${esc(tname(id))}</div>
      <div class="v">${count(id)}<small>/ ${ALL.length}</small></div>${bar(count(id), ALL.length)}</div>`).join("");
  const both = ALL.filter(c => IDS.every(id => found(id, c))).length;
  $("#total").innerHTML = `🏁 <b>${countAny(ALL)}</b> / ${ALL.length} found together`;
  $("#stats").innerHTML = `<div class="sgrid">` + IDS.map(id => {
    const row = (l, n, t) => `<div class="srow"><div><span>${l}</span><b>${n}/${t}</b></div>${bar(n, t)}</div>`;
    const ppl = (PEOPLE[id] || []).map(p => `<span>${esc(p)} <b>${ALL.filter(c => found(id, c)?.by === p).length}</b></span>`).join("");
    return `<div class="scol" style="--c:${TEAMS[id].color}"><h4>${esc(tname(id))}</h4>
      ${row("US states", count(id, US), US.length)}${row("Canada", count(id, CA), CA.length)}
      <div class="srow"><div><span>Washington D.C.</span><b>${found(id,"DC") ? "✓" : "–"}</b></div></div>
      ${ppl ? `<div class="ppl">${ppl}</div>` : ""}</div>`;
  }).join("") + `<div class="sboth">${both} in both cars · US ${countAny(US)}/${US.length} · CA ${countAny(CA)}/${CA.length}${IDS.some(id=>found(id,"DC"))?" · DC ✓":""} together</div></div>`;
  renderPlates(); renderMap(); renderStatus();
}
function renderPlates() {
  $("#boards").innerHTML = Object.entries(REGIONS).map(([title, items]) =>
    `<h2>${title}</h2><div class="grid">` + Object.entries(items).map(([code, name]) => {
      const mine = found(me, code);
      return `<div class="tile ${mine?"me-on":""}" data-code="${code}" style="--mine:${TEAMS[me].color}">
        <div class="dots">${IDS.map(id => `<span class="dot ${found(id,code)?"on":""}" style="--c:${TEAMS[id].color}"></span>`).join("")}</div>
        ${mine?.by ? `<span class="by">${esc(mine.by)}</span>` : ""}
        <div class="code">${code}</div><div class="nm">${name}</div></div>`;
    }).join("") + `</div>`).join("");
}
function fillFor(code) {
  const f = IDS.filter(id => found(id, code));
  return f.length === 2 ? "var(--both)" : f.length ? TEAMS[f[0]].color : "var(--land)";
}
const COMPASS = `<svg class="compass" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#fffaea" stroke="#2a2733" stroke-width="2"/><path d="M20 4l5 16-5 3-5-3z" fill="#e11d48"/><path d="M20 36l-5-16 5-3 5 3z" fill="#2a2733"/><text x="20" y="13" font-size="7" font-weight="700" text-anchor="middle" fill="#fffaea" font-family="sans-serif">N</text></svg>`;
function renderMap() {
  const M = window.MAP; if (!M) return;
  $("#mapview").innerHTML = `<div class="mapwrap"><svg class="usmap" viewBox="0 0 ${M.w} ${M.h}">` +
    Object.entries(M.paths).map(([c, d]) => `<path data-code="${c}" d="${d}" fill="${fillFor(c)}"/>`).join("") + `</svg>${COMPASS}</div>
    <div class="legend">${IDS.map(id => `<span><i style="background:${TEAMS[id].color}"></i>${esc(tname(id))} only</span>`).join("")}
    <span><i style="background:var(--both)"></i>Both</span><span><i style="background:var(--land)"></i>Not yet</span></div>`;
}
function renderStatus() {
  const t = lastSync ? new Date(lastSync).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "never";
  $("#net").textContent = !db ? "Local only (no Firebase configured)"
    : online ? "● Live" : `○ Offline, edits saved. Last sync ${t}`;
}

// ---- detail / who-saw-it sheet ----
const fmt = t => new Date(t).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
function openSheet(code) {
  const mine = found(me, code), people = PEOPLE[me] || [];
  const rows = IDS.map(id => {
    const e = found(id, code);
    const loc = e?.lat != null ? ` · <a href="https://maps.google.com/?q=${e.lat},${e.lon}" target="_blank" rel="noopener">${e.lat.toFixed(3)}, ${e.lon.toFixed(3)} ↗</a>` : (e ? ` · <span class="s">no GPS fix</span>` : "");
    return `<div class="row" style="--c:${TEAMS[id].color}"><b>${esc(tname(id))}</b>: ${e ? `${e.by ? esc(e.by) + " · " : ""}${fmt(e.t)}${loc}` : `<span class="s">not spotted</span>`}</div>`;
  }).join("");
  const chips = people.map(p => `<button data-by="${esc(p)}" class="${mine?.by === p ? "on" : ""}">${esc(p)}</button>`).join("");
  $("#sheet").style.setProperty("--c", TEAMS[me].color);
  $("#sheet").innerHTML = `<h3>${NAME[code]} (${code})</h3>${rows}
    <div class="lbl">${mine ? "Change who saw it" : "Who saw it?"}</div>
    <div class="chips" data-code="${code}">${chips}${mine ? `<button class="danger" data-remove>Remove</button>` : ""}<button class="cancel" data-close>${mine ? "Done" : "Cancel"}</button></div>`;
  $("#sheetbg").style.display = "flex";
}
const closeSheet = () => $("#sheetbg").style.display = "none";
$("#sheetbg").addEventListener("click", e => {
  if (e.target.id === "sheetbg" || e.target.closest("[data-close]")) return closeSheet();
  const chips = e.target.closest(".chips"); if (!chips) return;
  const code = chips.dataset.code, b = e.target.closest("button"); if (!b) return;
  if (b.hasAttribute("data-remove")) { remove(code); return closeSheet(); }
  const by = b.dataset.by;
  if (found(me, code)) { setBy(code, by); openSheet(code); } else { markFound(code, by); closeSheet(); }
});
const onCode = e => { const el = e.target.closest("[data-code]"); if (el && me) openSheet(el.dataset.code); };
$("#boards").addEventListener("click", onCode);
$("#mapview").addEventListener("click", onCode);

let statsOpen = load("plate.statsOpen", false);
function setStats(o) { statsOpen = o; save("plate.statsOpen", o); $("#statswrap").classList.toggle("open", o); $("#statsbtn").setAttribute("aria-expanded", o); }
$("#statsbtn").onclick = () => setStats(!statsOpen);
setStats(statsOpen);

$(".tabs").addEventListener("click", e => {
  const t = e.target.dataset.tab; if (!t) return;
  tab = t;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  $("#boards").style.display = t === "plates" ? "" : "none";
  $("#mapview").style.display = t === "map" ? "block" : "none";
});

$("#score").addEventListener("click", e => {
  if (!e.target.closest(".team.me")) return;
  const n = prompt("Rename your car:", tname(me));
  if (n === null || !n.trim()) return;
  names[me] = { n: n.trim().slice(0, 24), t: Date.now() };
  save("plate.names", names); render();
  if (db) db.ref(`${CFG.room}/names/${me}`).set(names[me]).catch(() => {});
});

function chooseCar() {
  $("#whoBtns").innerHTML = IDS.map(id => `<button data-id="${id}" style="background:${TEAMS[id].color}">${esc(tname(id))}</button>`).join("");
  $("#who").style.display = "flex";
}
$("#whoBtns").addEventListener("click", e => {
  const id = e.target.dataset.id; if (!id) return;
  me = id; save("plate.me", me); $("#who").style.display = "none"; render(); pushAll();
});
$("#switch").onclick = chooseCar;

/* Photo feature disabled: most cars pass too fast for photos to be practical.
let photoFor = null;
$("#file").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f || !photoFor) return;
  const img = await createImageBitmap(f);
  const w = 360, h = Math.round(img.height * w / img.width);
  const c = Object.assign(document.createElement("canvas"), { width: w, height: h });
  c.getContext("2d").drawImage(img, 0, 0, w, h);
  state[me][photoFor] = { ...state[me][photoFor], img: c.toDataURL("image/jpeg", 0.6), m: Date.now() };
  commit(photoFor); photoFor = null;
});
*/

if (!me) chooseCar(); else render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
